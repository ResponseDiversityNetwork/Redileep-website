project:
  type: website
  output-dir: _site

website:
  title: "ReDiLEEP"
  description: "A funded MSCA Doctoral Network using response diversity knowledge to leverage efficient ecosystem preservation and restoration."
  site-url: "https://redileep.eu"
  favicon: assets/favicon.svg
  navbar:
    pinned: true
    logo: assets/network-logo/redileep-logo.png
    left:
      - text: "About"
        href: about.qmd
      - text: "Research"
        href: research.qmd
      - text: "Training"
        href: training.qmd
      - text: "Partners"
        href: partners.qmd
      - text: "People"
        href: people.qmd
      - text: "Vacancies"
        href: vacancies.qmd
      - text: "News"
        href: news.qmd
    right:
      - text: "Contact"
        href: contact.qmd
  page-footer:
    left: |
      ```{=html}
      <img src="assets/funder-logos/eu-funded.png" alt="Funded by the European Union" class="funder-logo">
      ```
      © 2026 - ReDiLEEP MSCA DN project. All rights reserved. This project has received funding from the European Union Horizon Europe research and innovation programme under the Marie Skłodowska-Curie Actions (MSCA) grant agreement No. 101312530. Views and opinions expressed are however those of the authors only and do not necessarily reflect those of the European Union, which cannot be held responsible for them.
    right:
      - text: "Contact"
        href: contact.qmd
      - text: "News"
        href: news.qmd

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: false
    smooth-scroll: true
    page-layout: full
    link-external-newwindow: true
